services:
    traefik:
        image: traefik:v3.7
        restart: unless-stopped
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:443
            - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
            - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
            - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - letsencrypt:/letsencrypt

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
        restart: unless-stopped
        environment:
            discovery.type: single-node
            cluster.name: globalview
            node.name: elasticsearch
            xpack.security.enabled: "true"
            xpack.security.autoconfiguration.enabled: "false"
            xpack.security.http.ssl.enabled: "false"
            ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
        mem_limit: ${ELASTICSEARCH_MEMORY_LIMIT:-2g}
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl --fail --silent --user "elastic:$$ELASTIC_PASSWORD" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null'
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        labels:
            traefik.enable: "false"

    postgres:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-globalview}
            POSTGRES_USER: ${POSTGRES_USER:-globalview}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        labels:
            traefik.enable: "false"

    tika:
        image: apache/tika
        restart: unless-stopped
        labels:
            traefik.enable: "false"

    redis:
        image: redis:7
        restart: unless-stopped
        command: [ "redis-server", "--appendonly", "yes" ]
        volumes:
            - redis-data:/data
        healthcheck:
            test: [ "CMD-SHELL", 'redis-cli ping | grep -qx PONG' ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        labels:
            traefik.enable: "false"

    mercure:
        image: dunglas/mercure
        restart: unless-stopped
        environment:
            SERVER_NAME: ":80"
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY}
            MERCURE_TRUSTED_ISSUERS: https://global-admin-ems7.theus.be
            MERCURE_EXTRA_DIRECTIVES: |
                resource_identifier https://global-admin-ems7.theus.be/.well-known/mercure
        volumes:
            - mercure-data:/data
            - mercure-config:/config
        labels:
            traefik.enable: "true"
            traefik.http.routers.mercure.rule: Host(`global-admin-ems7.theus.be`) && (Path(`/.well-known/mercure`) || PathPrefix(`/.well-known/mercure/`))
            traefik.http.routers.mercure.priority: "200"
            traefik.http.routers.mercure.entrypoints: websecure
            traefik.http.routers.mercure.tls: "true"
            traefik.http.routers.mercure.tls.certresolver: letsencrypt
            traefik.http.routers.mercure.service: mercure
            traefik.http.services.mercure.loadbalancer.server.port: "80"

    ems-admin:
        image: elasticms/admin:${EMS_VERSION}
        restart: unless-stopped
        depends_on:
            - postgres
        environment:
            - APP_ENV=redis
            - TZ=Europe/Brussels
            - PHP_FPM_PM_MAX_CHILDREN=4
            - PHP_MEMORY_LIMIT=256M
            - MAILER_URL=${MAILER_URL}
            - EMSCO_TIKA_SERVER=http://tika:9998
            - EMS_BACKEND_URL=https://global-admin-ems7.theus.be
            - INSTANCE_ID=${INSTANCE_ID:-globalview_}
            - EMS_ELASTICSEARCH_HOSTS=${EMS_ELASTICSEARCH_HOSTS}
            - EMS_STORAGES=${EMS_ADMIN_STORAGES}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - DB_HOST=postgres
            - DB_DRIVER=pgsql
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_PORT=5432
            - DB_NAME=${POSTGRES_DB}
            - DB_SCHEMA=${DB_SCHEMA:-public}
            - EMSF_AUTHKEY=${EMSF_AUTHKEY}
            - TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
            - TRUSTED_HOSTS=global-admin-ems7.theus.be
            - APP_SECRET=${APP_SECRET_ADMIN}
            - PHP_OPENTELEMETRY_ENABLED=false
            - METRICS_ENABLED=false
            - MESSENGER_ENABLED=true
            - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
            - APP_LOG_DIR=/app/var/log/elasticms
            - APP_CACHE_DIR=/app/var/cache/elasticms
            - OTEL_SDK_DISABLED=true
            - OTEL_PHP_AUTOLOAD_ENABLED=false
            - OTEL_PHP_FIBERS_ENABLED=false
            - OTEL_PHP_DISABLED_INSTRUMENTATIONS=all
        tmpfs:
            - /opt/sbin:rw,exec,size=8m,mode=1777
            - /opt/etc:rw,noexec,size=8m,mode=1777
            - /app/var:rw,exec,size=1g,mode=1777
            - /app/tmp:rw,noexec,size=64m,mode=1777
        volumes:
            - ./admin:/opt/config/elasticms
        labels:
            traefik.enable: "true"
            traefik.http.routers.ems-admin.rule: Host(`global-admin-ems7.theus.be`)
            traefik.http.routers.ems-admin.entrypoints: websecure
            traefik.http.routers.ems-admin.tls: "true"
            traefik.http.routers.ems-admin.tls.certresolver: letsencrypt
            traefik.http.routers.ems-admin.service: ems-admin
            traefik.http.services.ems-admin.loadbalancer.server.port: "9000"

    ems-web:
        image: elasticms/website-skeleton:${EMS_VERSION}
        restart: unless-stopped
        environment:
            - APP_ENV=redis
            - APP_SECRET=${APP_SECRET_WEB}
            - TZ=Europe/Brussels
            - PHP_FPM_PM_MAX_CHILDREN=8
            - PHP_MEMORY_LIMIT=64M
            - MAILER_URL=${MAILER_URL}
            - EMS_BACKEND_URL=https://global-admin-ems7.theus.be
            - INSTANCE_ID=${INSTANCE_ID:-globalview_}
            - EMSF_AUTHKEY=${EMSF_AUTHKEY}
            - EMS_ELASTICSEARCH_HOSTS=${EMS_ELASTICSEARCH_HOSTS}
            - EMS_STORAGES=${EMS_WEB_STORAGES}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
            - TRUSTED_HOSTS=global-web-ems7.theus.be,globalview.be,www.globalview.be
            - EMS_HTTP_CACHES=[{"header":"x-varnish","url":"http://varnish/","headers":{"X-Invalidate-Token":"${VARNISH_TOKEN}"}}]
            - PHP_OPENTELEMETRY_ENABLED=false
            - METRICS_ENABLED=true
            - MESSENGER_ENABLED=true
            - APP_LOG_DIR=/app/var/log/elasticms
            - APP_CACHE_DIR=/app/var/cache/elasticms
            - OTEL_SDK_DISABLED=true
            - OTEL_PHP_AUTOLOAD_ENABLED=false
            - OTEL_PHP_FIBERS_ENABLED=false
            - OTEL_PHP_DISABLED_INSTRUMENTATIONS=all
        tmpfs:
            - /opt/sbin:rw,exec,size=8m,mode=1777
            - /opt/etc:rw,noexec,size=8m,mode=1777
            - /app/var:rw,exec,size=512m,mode=1777
            - /app/tmp:rw,noexec,size=64m,mode=1777
        volumes:
            - ./web:/opt/config/elasticms
            - /srv/cms-cache/ems-web-config:/var/lib/ems
        labels:
            traefik.enable: "true"
            traefik.http.routers.ems-web.rule: Host(`global-web-ems7.theus.be`)
            traefik.http.routers.ems-web.entrypoints: websecure
            traefik.http.routers.ems-web.tls: "true"
            traefik.http.routers.ems-web.tls.certresolver: letsencrypt
            traefik.http.routers.ems-web.service: ems-web
            traefik.http.services.ems-web.loadbalancer.server.port: "9000"

